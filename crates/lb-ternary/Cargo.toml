[package]
name = "lb-ternary"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Ternary (BitNet b1.58) packed weights, int8 activation quantization and CPU GEMV/GEMM kernels"

[dependencies]
rayon.workspace = true

# Thread pinning for the optional two-socket mode (LB_NUMA) uses Linux sched_setaffinity.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["sched"] }

[dev-dependencies]
rayon.workspace = true

[[bench]]
name = "kbench"
harness = false
