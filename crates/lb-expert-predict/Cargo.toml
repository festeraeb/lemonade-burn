[package]
name = "lb-expert-predict"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Offline MoE routing analysis on lemonade-burn: next-layer expert prediction from hidden states (pre-gating hit rate) and the expert stand-in finder"

[dependencies]
lb-gguf.workspace = true
lb-lfm2.workspace = true
burn.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
tokenizers.workspace = true
sha2.workspace = true
memmap2.workspace = true
# already in Cargo.lock through burn-flex; used for the f32 expert GEMMs of the stand-in finder
gemm = "0.19"

[[bin]]
name = "lb-expert-capture"
path = "src/bin/lb-expert-capture.rs"

[[bin]]
name = "lb-expert-report"
path = "src/bin/lb-expert-report.rs"

[[bin]]
name = "lb-expert-standin"
path = "src/bin/lb-expert-standin.rs"

[features]
default = []
# Resident experts/dense on the wgpu device (LB_WGPU_DEVICE) for a faster capture.
gpu = ["lb-lfm2/gpu"]
cuda = ["gpu", "lb-lfm2/cuda"]
