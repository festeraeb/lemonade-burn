[package]
name = "lb-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "OpenAI-compatible HTTP server for the lemonade-burn BitNet runtime"

[[bin]]
name = "lemonade-burn-server"
path = "src/main.rs"

[features]
default = []
# Resident LFM2 experts on the wgpu device named by LB_WGPU_DEVICE.
gpu = ["lb-lfm2/gpu"]
# Also build the cubecl-cuda runtime (LB_CUDA_DEVICE=N); see lb-q4-gpu.
cuda = ["gpu", "lb-lfm2/cuda"]

[dependencies]
lb-model.workspace = true
lb-lfm2.workspace = true
lb-ternary.workspace = true
burn.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
futures-util = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
