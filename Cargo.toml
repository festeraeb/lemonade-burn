[workspace]
resolver = "2"
members = ["crates/lb-ternary", "crates/lb-convert", "crates/lb-model", "crates/lb-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
rayon = "1.10"
safetensors = "0.8"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
lb-ternary = { path = "crates/lb-ternary" }
lb-convert = { path = "crates/lb-convert" }
lb-model = { path = "crates/lb-model" }
burn = { version = "=0.22.1", default-features = false, features = ["std", "flex", "extension"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1

[profile.bench]
inherits = "release"
